name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Main-process tests
        run: npm run test:node

      # Renderer tests run the real UI in hidden Electron windows; they need a display
      - name: Renderer tests
        run: xvfb-run -a npm run test:electron

      # Starts the real main process; catches e.g. dependency upgrades that break startup
      - name: App boots
        run: xvfb-run -a npm run test:main
